<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>長官儀表板 MVP Prototype｜DUSKIN 銷售系統</title>
<!--
  ═══════════════════════════════════════════════════════════════════════
  長官儀表板 — MVP Prototype（僅供驗證，非正式產品）
  ─────────────────────────────────────────────────────────────────────
  目的：驗證 資訊架構 / 使用流程 / 頁面層級 / 操作方式 / 狀態與 Edge Case
  限制：單一 HTML、CSS/JS 內嵌、無 Backend、無 DB、無登入、全 Mock Data
  外部依賴：僅 Leaflet 1.9.4（與主系統同一組 unpkg CDN + SRI）；載入失敗
           會自動退為「無地圖」提示，不影響其他功能。
  資料：TODAY 固定為 2026-08-16、亂數為 seeded（mulberry32），
       每次開啟結果完全相同，方便反覆對照討論。
  ═══════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
/* ═══ DESIGN TOKENS（對齊主系統 tokens.css，內嵌以維持單檔） ═══ */
:root{
  --green:#12A673;--green-d:#0A6849;--green-l:#E3F4ED;--green-b:#A1DFC7;
  --theme:#085041;
  --red:#B73838;--red-l:#FBEAEA;--red-b:#F7C1C1;
  --amber:#B5701A;--amber-l:#FAEEDA;--amber-d:#633806;--amber-b:#FAC775;
  --blue:#2A6BB0;--blue-l:#E6F0FA;--blue-d:#0C447C;--blue-b:#B5D4F4;
  --purple-l:#EEEDFE;--purple-d:#3C3489;
  --ss-gray-bg:#F1EFE8;--ss-gray-fg:#444441;
  --ss-blue-bg:#E6F1FB;--ss-blue-fg:#0C447C;
  --ss-amber-bg:#FAEEDA;--ss-amber-fg:#633806;
  --ss-purple-bg:#EEEDFE;--ss-purple-fg:#3C3489;
  --ss-green-bg:#E1F5EE;--ss-green-fg:#085041;
  --ss-green2-bg:#D4EDDA;--ss-green2-fg:#155724;
  --ss-red-bg:#FCEBEB;--ss-red-fg:#A32D2D;
  --bg:#ffffff;--bg2:#F8F8F5;--bg3:#EFEEE9;
  --text:#14140F;--text2:#56564F;--text3:#8F8F87;
  --border:#E8E7E0;--border2:#D4D3CB;
  --surface-hover:#F9F9F5;
  --r-sm:6px;--r:10px;--r-lg:14px;
  --shadow-sm:0 1px 2px rgba(20,20,15,.04);
  --shadow:0 1px 3px rgba(20,20,15,.05);
  --shadow-md:0 4px 14px rgba(20,20,15,.07);
  --shadow-lg:0 12px 32px rgba(20,20,15,.14);
  --ring:0 0 0 3px rgba(18,166,115,.18);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-sans:'Inter','Noto Sans TC',-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang TC','Microsoft JhengHei',sans-serif;
  --skel:#EFEEE9;--skel2:#F8F8F5;
  /* 主色的「選中態」組合：深色模式整組換掉，避免各處寫死 */
  --accent:#085041;--accent-fg:#ffffff;--link:#2A6BB0;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1A1B19;--bg2:#121311;--bg3:#25262A;
  --text:#ECECE7;--text2:#A4A49C;--text3:#6A6A63;
  --border:#292A26;--border2:#3A3A34;
  --surface-hover:#242520;
  --green:#1AB180;--green-d:#7BDFBA;--green-l:#163A2C;--green-b:#2A6551;
  --red:#E66B6B;--red-l:#3A1F1F;--red-b:#553030;
  --amber-l:#3A2F1A;--amber-d:#F0C878;--amber-b:#54431F;
  --blue-l:#1A2A3D;--blue-d:#9ECCFF;--blue-b:#2A3F58;
  --purple-l:#24223D;--purple-d:#C5C0FA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(26,177,128,.3);
  --ss-gray-bg:#2A2B27;--ss-gray-fg:#B9B9B0;
  --ss-blue-bg:#1A2A3D;--ss-blue-fg:#9ECCFF;
  --ss-amber-bg:#3A2F1A;--ss-amber-fg:#F0C878;
  --ss-purple-bg:#24223D;--ss-purple-fg:#C5C0FA;
  --ss-green-bg:#163A2C;--ss-green-fg:#7BDFBA;
  --ss-green2-bg:#17361F;--ss-green2-fg:#8FD9A8;
  --ss-red-bg:#3A1F1F;--ss-red-fg:#E66B6B;
  --skel:#25262A;--skel2:#2E2F30;
  --accent:#1AB180;--accent-fg:#0B1210;--link:#9ECCFF;
}}
:root[data-theme=dark]{
  --bg:#1A1B19;--bg2:#121311;--bg3:#25262A;
  --text:#ECECE7;--text2:#A4A49C;--text3:#6A6A63;
  --border:#292A26;--border2:#3A3A34;
  --surface-hover:#242520;
  --green:#1AB180;--green-d:#7BDFBA;--green-l:#163A2C;--green-b:#2A6551;
  --red:#E66B6B;--red-l:#3A1F1F;--red-b:#553030;
  --amber-l:#3A2F1A;--amber-d:#F0C878;--amber-b:#54431F;
  --blue-l:#1A2A3D;--blue-d:#9ECCFF;--blue-b:#2A3F58;
  --purple-l:#24223D;--purple-d:#C5C0FA;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);--shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.5);--shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(26,177,128,.3);
  --ss-gray-bg:#2A2B27;--ss-gray-fg:#B9B9B0;
  --ss-blue-bg:#1A2A3D;--ss-blue-fg:#9ECCFF;
  --ss-amber-bg:#3A2F1A;--ss-amber-fg:#F0C878;
  --ss-purple-bg:#24223D;--ss-purple-fg:#C5C0FA;
  --ss-green-bg:#163A2C;--ss-green-fg:#7BDFBA;
  --ss-green2-bg:#17361F;--ss-green2-fg:#8FD9A8;
  --ss-red-bg:#3A1F1F;--ss-red-fg:#E66B6B;
  --skel:#25262A;--skel2:#2E2F30;
  --accent:#1AB180;--accent-fg:#0B1210;--link:#9ECCFF;
}

/* ═══ BASE ═══ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-sans);background:var(--bg2);color:var(--text);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:56px;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ═══ TOPBAR ═══ */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--border);
}
.tb-row{
  max-width:1360px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{
  width:26px;height:26px;border-radius:7px;background:var(--theme);
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;
}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand-sub{font-size:11px;color:var(--text3);margin-left:2px}
.tb-spacer{flex:1}
.search-wrap{position:relative;flex:0 1 300px;min-width:150px}
.search-wrap input{
  width:100%;padding:7px 11px 7px 32px;border:1px solid var(--border2);
  border-radius:var(--r);background:var(--bg2);color:var(--text);
  font-family:inherit;font-size:13px;
}
.search-wrap input:focus{outline:none;box-shadow:var(--ring);border-color:var(--green)}
.search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);display:flex}
.sugg{
  position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--bg);
  border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow-lg);
  max-height:320px;overflow:auto;z-index:70;display:none;
}
.sugg.on{display:block}
.sugg-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.sugg-item:last-child{border-bottom:0}
.sugg-item:hover,.sugg-item.sel{background:var(--surface-hover)}
.sugg-item .s-sub{font-size:11px;color:var(--text3)}
.sugg-empty{padding:14px;text-align:center;color:var(--text3);font-size:12px}

.icon-btn{
  background:transparent;border:1px solid var(--border2);border-radius:var(--r);
  padding:6px 9px;color:var(--text2);display:flex;align-items:center;gap:5px;font-size:12px;
}
.icon-btn:hover{background:var(--surface-hover);color:var(--text)}

/* ═══ VIEW TABS ═══ */
.tabs{max-width:1360px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.tab{
  background:transparent;border:0;border-bottom:2px solid transparent;
  padding:9px 14px;color:var(--text2);font-size:13.5px;font-weight:500;
  display:flex;align-items:center;gap:6px;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tab .cnt{
  font-size:11px;background:var(--bg3);color:var(--text2);
  padding:1px 6px;border-radius:9px;font-weight:600;
}

/* ═══ LAYOUT ═══ */
.wrap{max-width:1360px;margin:0 auto;padding:16px 20px 40px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

/* ═══ CARD ═══ */
.card{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);overflow:hidden;
}
.card-h{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
}
.card-t{font-weight:700;font-size:14px}
.card-sub{font-size:11.5px;color:var(--text3);font-weight:400}
.card-b{padding:14px 16px}
.card-b.tight{padding:6px 0}

/* ═══ 資料狀態列 ═══ */
.databar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;border-radius:var(--r);margin-bottom:14px;
  font-size:12.5px;border:1px solid var(--border);background:var(--bg);color:var(--text2);
}
.databar.warn{background:var(--amber-l);border-color:var(--amber-b);color:var(--amber-d)}
.databar.err{background:var(--red-l);border-color:var(--red-b);color:var(--red)}
.databar b{font-weight:700}
.databar .db-spacer{flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.warn{background:var(--amber)}
.dot.err{background:var(--red)}

/* ═══ KPI ═══ */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{
  background:var(--bg);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:13px 15px;box-shadow:var(--shadow-sm);text-align:left;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
  display:block;width:100%;
}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--border2)}
.kpi-l{font-size:11.5px;color:var(--text3);display:flex;align-items:center;gap:4px}
.kpi-v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.1}
.kpi-v small{font-size:14px;font-weight:600;color:var(--text2);margin-left:2px}
.kpi-d{font-size:11.5px;color:var(--text3);margin-top:3px}
.kpi.accent .kpi-v{color:var(--green-d)}
.kpi .go{font-size:10.5px;color:var(--text3);margin-top:5px;opacity:0;transition:opacity .12s}
.kpi:hover .go{opacity:1}

/* ═══ ATTENTION FEED ═══ */
.att-filters{display:flex;gap:5px;flex-wrap:wrap;padding:10px 16px 0}
.chip{
  border:1px solid var(--border2);background:var(--bg);color:var(--text2);
  border-radius:20px;padding:3px 11px;font-size:12px;display:inline-flex;align-items:center;gap:5px;
}
.chip:hover{background:var(--surface-hover)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.chip .n{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.sev-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sev-1{background:var(--red)}
.sev-2{background:var(--amber)}
.sev-3{background:var(--blue)}
.sev-4{background:var(--text3)}

.att-list{display:flex;flex-direction:column}
.att{
  display:flex;gap:11px;padding:11px 16px;border-top:1px solid var(--border);
  cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;
  width:100%;align-items:flex-start;
}
.att:hover{background:var(--surface-hover)}
.att-bar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}
.att-bar.s1{background:var(--red)}
.att-bar.s2{background:var(--amber)}
.att-bar.s3{background:var(--blue)}
.att-bar.s4{background:var(--border2)}
.att-body{flex:1;min-width:0}
.att-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.att-name{font-weight:700;font-size:13.5px;max-width:100%}
.att-reason{font-size:12.5px;color:var(--text2);margin-top:2px}
.att-reason b{color:var(--text);font-weight:700}
.att-meta{font-size:11.5px;color:var(--text3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.att-amt{text-align:right;flex-shrink:0}
.att-amt .a{font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.att-amt .l{font-size:10.5px;color:var(--text3)}

/* ═══ BADGE ═══ */
.badge{
  display:inline-block;padding:1px 8px;border-radius:20px;
  font-size:11px;font-weight:700;white-space:nowrap;line-height:1.7;
}
.badge.sm{font-size:10.5px;padding:0 7px}
.tag{
  display:inline-block;padding:0 6px;border-radius:4px;font-size:10.5px;
  background:var(--bg3);color:var(--text2);font-weight:600;
}
.tag.warn{background:var(--amber-l);color:var(--amber-d)}
.tag.err{background:var(--red-l);color:var(--red)}

/* ═══ FUNNEL ═══ */
.fn{display:flex;flex-direction:column;gap:9px}
.fn-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center}
.fn-lab{font-size:12.5px;color:var(--text2);text-align:right}
.fn-track{background:var(--bg3);border-radius:5px;height:22px;position:relative;overflow:hidden}
.fn-fill{display:block;height:100%;border-radius:5px;transition:width .5s var(--ease);min-width:3px}
.fn-num{font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--text2)}
.fn-num b{color:var(--text);font-weight:700;font-size:13.5px}
.fn-foot{
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--border2);
  font-size:11.5px;color:var(--text3);display:flex;gap:14px;flex-wrap:wrap;
}

/* ═══ REP CARD ═══ */
.rep{
  padding:11px 14px;border-top:1px solid var(--border);cursor:pointer;
  background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;
}
.rep:hover{background:var(--surface-hover)}
.rep-top{display:flex;align-items:center;gap:9px}
.avatar{
  width:28px;height:28px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;
}
.rep-name{font-weight:700;font-size:13.5px}
.rep-area{font-size:11px;color:var(--text3)}
.rep-nums{margin-left:auto;text-align:right;flex-shrink:0}
.rep-nums .a{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--green-d)}
.rep-nums .l{font-size:10.5px;color:var(--text3)}
.mini{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:9px;background:var(--bg3)}
.mini i{display:block;height:100%}
.rep-foot{display:flex;gap:12px;font-size:11px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.rep-foot b{color:var(--text2);font-weight:700}

/* ═══ DISTRICT BARS ═══ */
.dist{
  display:grid;grid-template-columns:62px minmax(0,1fr) 74px;gap:9px;align-items:center;
  padding:6px 14px;cursor:pointer;background:transparent;border:0;width:100%;text-align:left;
}
.dist:hover{background:var(--surface-hover)}
.dist-lab{font-size:12.5px;color:var(--text2)}
.dist-track{background:var(--bg3);border-radius:4px;height:16px;overflow:hidden;display:flex}
.dist-track i{height:100%;display:block}
.dist-num{font-size:11.5px;color:var(--text3);text-align:right;font-variant-numeric:tabular-nums}
.dist-num b{color:var(--text);font-weight:700}

/* ═══ FILTER BAR ═══ */
.fbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:12px 14px;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-lg);margin-bottom:12px;
}
.fbar select{
  padding:6px 9px;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg2);color:var(--text);font-family:inherit;font-size:12.5px;max-width:160px;
}
.fbar select:focus{outline:none;box-shadow:var(--ring)}
.fbar-lab{font-size:11.5px;color:var(--text3);margin-right:-4px}
.fbar .res{margin-left:auto;font-size:12.5px;color:var(--text2)}
.fbar .res b{color:var(--text);font-weight:700}
.linkbtn{background:transparent;border:0;color:var(--link);font-size:12.5px;text-decoration:underline;padding:2px 4px}

/* ═══ TABLE ═══ */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
.tbl th{
  text-align:left;font-size:11.5px;color:var(--text3);font-weight:600;
  padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  background:var(--bg);position:sticky;top:0;z-index:2;
}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--text)}
.tbl th .ar{opacity:.45;font-size:9px}
.tbl th.act .ar{opacity:1;color:var(--green-d)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-hover)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .cname{font-weight:600;max-width:230px}
.tbl .csub{font-size:11px;color:var(--text3);font-weight:400}
.muted{color:var(--text3)}

/* ═══ MAP ═══ */
.map-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px;align-items:start}
#map{height:620px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--bg3);z-index:1}
.map-side{max-height:620px;overflow:auto}
.mlist{
  display:flex;gap:9px;align-items:center;padding:9px 13px;border-top:1px solid var(--border);
  cursor:pointer;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;
}
.mlist:hover,.mlist.on{background:var(--surface-hover)}
.mlist .pin{width:9px;height:9px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--bg)}
.mlist .mn{flex:1;min-width:0;font-size:12.5px;font-weight:600}
.mlist .ms{font-size:10.5px;color:var(--text3);font-weight:400}
.mlist .ma{font-size:12px;font-variant-numeric:tabular-nums;color:var(--text2);flex-shrink:0}
.legend{display:flex;gap:11px;flex-wrap:wrap;padding:10px 14px;font-size:11.5px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:block}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════

const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(n){return '$'+Math.round(n||0).toLocaleString('en-US');}

/* 固定「今天」→ prototype 每次開啟數字完全一致，方便反覆討論 */
const TODAY=new Date(2026,7,16);           // 2026-08-16
const DAY=86400000;
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function ago(n){return iso(new Date(TODAY.getTime()-n*DAY));}
function daysSince(s){if(!s)return null;const d=new Date(s+'T00:00:00');if(isNaN(d))return null;return Math.round((TODAY-d)/DAY);}
function dLabel(s){const n=daysSince(s);if(n==null)return '—';if(n===0)return '今天';if(n===1)return '昨天';return n+' 天前';}

/* seeded RNG：同一顆 seed 永遠產生同一份 mock data */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20260816);
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
function wpick(pairs){let t=0;pairs.forEach(p=>t+=p[1]);let r=rnd()*t;for(const p of pairs){r-=p[1];if(r<=0)return p[0];}return pairs[0][0];}

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */

];
const PMAP={};PRODUCTS.forEach(p=>PMAP[p.code]=p);

/* 金額口徑（與主系統 displayFw4 一致）：
   更換週期 1W/2W/4W → 每 4 週更換 4/2/1 次；4W 金額 = 契約單價 × 次數 × 數量 */
const CYCLE_N={'1W':4,'2W':2,'4W':1};
function fw4(it){
  const p=PMAP[it.product];if(!p)return 0;
  const n=CYCLE_N[it.cycle||p.cycle]||1;
  const unit=(it.quoted!=null&&it.quoted!=='')?it.quoted:p.price;
  return unit*n*(it.qty||1);
}
const sumFw4=items=>(items||[]).reduce((s,it)=>s+fw4(it),0);

/* ═══════════════════════════════════════════════════════════════════

  ['麵包坊','零售店'],['藥局','零售店'],['健身房','其他'],['寵物旅館','寵物']];

const NOTES=['老闆說要跟合夥人討論','現場丟了一支拖把試用，反應乾淨度不錯','價格卡在比同業高，需要做比較表','店裡剛裝修完，地墊需求明確','老闆娘很喜歡香味，芳香機有機會','要等下個月房租談完再說','已經有別家在做，合約到年底','窗口換人，要重新建立關係','試用回收時老闆主動問報價','店休沒遇到人，改約下週'];
const INSIGHTS=['決策者是老闆娘不是老闆','怕清潔費用增加，要強調免採購','連鎖第二家店，做起來可帶第三家','','','對地墊防滑很在意（曾有客人跌倒）',''];

/* ═══════════════════════════════════════════════════════════════════
   3. MOCK DATA — 客戶產生器
   ═══════════════════════════════════════════════════════════════════ */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* 狀態配額（精確分配，非隨機抽樣）
   ─ prototype 的目的是「每一種狀態都要能被看到」。n≈20 時純亂數常讓罕見狀態
     （已轉交 4%、拒絕 5%）整段抽空，demo 就少掉要驗證的畫面。配額法保證每次開啟
     都涵蓋九種狀態，且分佈固定可重現。 */
const STATUS_MIX=[[STATUS.UNVISITED,10],[STATUS.FIRST,17],[STATUS.REVISIT,15],[STATUS.TRIAL,20],
  [STATUS.QUOTE,8],[STATUS.CLOSING,6],[STATUS.DEAL,15],[STATUS.TRANSFER,4],[STATUS.REFUSE,5]];
function quota(n,mix){
  const tot=mix.reduce((s,p)=>s+p[1],0),out=[];
  const rows=mix.map(p=>{const e=n*p[1]/tot;return{k:p[0],base:Math.floor(e),frac:e-Math.floor(e)};});
  rows.forEach(r=>{for(let i=0;i<r.base;i++)out.push(r.k);});
  rows.slice().sort((a,b)=>b.frac-a.frac).forEach(r=>{if(out.length<n)out.push(r.k);});
  return shuffle(out);
}
/* 日期分佈：貼近真實外勤節奏 —— 多數客戶近兩週內拜訪過，少數才落到「久未拜訪」。
   若讓最後拜訪日平均散在 1~40 天，會有近半數客戶觸發警示，關注清單就淪為雜訊。 */
const lastDays =()=>wpick([[rint(0,6),46],[rint(7,14),25],[rint(15,21),12],[rint(22,34),12],[rint(35,60),5]]);
const trialDays=()=>wpick([[rint(2,14),40],[rint(15,30),38],[rint(31,45),14],[rint(46,75),8]]);

let _seq=0;
function makeClient(rep,forced){
  const status=(forced&&forced.status)||STATUS.FIRST;
  const district=(forced&&forced.district)||pick(REP_DIST[rep.id]);
  const suffix=pick(NAME_B);
  const name=(forced&&forced.name)||(pick(NAME_A)+suffix[0]);
  const d=DMAP[district];
  const c={
    id:'c'+(++_seq),repId:rep.id,name:name,status:status,district:district,
    type:(forced&&forced.type)||suffix[1],
    addr:'台南市'+district+pick(ROADS)+rint(1,3)+'段'+rint(1,399)+'號',
    contact:pick(['王','李','陳','林','張','黃','吳','蔡','劉','許'])+pick(['先生','小姐','老闆','店長']),
    phone:'06-'+rint(200,399)+rint(1000,9999),
    trialItems:[],contractedItems:[],visits:[],
    lat:null,lng:null,nextdate:'',trialDate:'',note:''
  };
  if(!(forced&&forced.noGeo)){
    c.lat=+(d.lat+(rnd()-.5)*0.024).toFixed(6);
    c.lng=+(d.lng+(rnd()-.5)*0.030).toFixed(6);
  }
  /* 試用起始日先算——拜訪日必須晚於（或等於）試用投放日才合理 */
  let td=null;
  if(TRIAL_SET.includes(status))td=(forced&&forced.trialDays!=null)?forced.trialDays:trialDays();
  if(td!=null)c.trialDate=ago(td);
  /* 拜訪紀錄 */
  const nv=status===STATUS.UNVISITED?0:rint(1,5);
  let last=(forced&&forced.lastVisitDays!=null)?forced.lastVisitDays:lastDays();
  if(td!=null)last=Math.min(last,td);
  /* 累加間距（非乘法）——乘法會讓相鄰兩次拜訪偶爾撞在同一兩天內，看起來就像壞資料 */
  let cur=last;
  for(let i=0;i<nv;i++){
    c.visits.push({date:ago(cur),mood:rint(1,4),note:pick(NOTES),insight:pick(INSIGHTS)});
    cur+=rint(9,26);
  }
  /* 試用／成約品項 */
  if(TRIAL_SET.includes(status)&&!(forced&&forced.noItems)){
    const big=(forced&&forced.big)||rnd()<0.12;
    const n=big?rint(3,4):rint(1,3);
    const pool=big?PRODUCTS.filter(p=>p.price>=280):PRODUCTS;
    const used={};
    for(let i=0;i<n;i++){
      const p=pick(pool);if(used[p.code])continue;used[p.code]=1;
      c.trialItems.push({product:p.code,qty:big?rint(3,8):rint(1,4),cycle:p.cycle,quoted:''});
    }
  }
  if(status===STATUS.DEAL){
    const n=rint(1,3),used={};
    for(let i=0;i<n;i++){
      const p=pick(PRODUCTS);if(used[p.code])continue;used[p.code]=1;
      c.contractedItems.push({product:p.code,qty:rint(1,5),cycle:p.cycle,
        quoted:rnd()<0.4?Math.round(p.price*0.9):'',contractDate:ago(rint(10,220))});
    }
  }
  if(ACTIVE_SET.includes(status)&&rnd()<0.55)c.nextdate=iso(new Date(TODAY.getTime()+rint(-6,14)*DAY));
  c.note=pick(NOTES);
  return c;
}

const CLIENTS=[];
REPS.forEach(rep=>{quota(rep.n,STATUS_MIX).forEach(st=>CLIENTS.push(makeClient(rep,{status:st})));});

/* ── 刻意植入的 Edge Case 資料 ────────────────────────────────── */

CLIENTS.push(makeClient(RMAP.r1,{name:'廣豐興餐飲集團中央廚房',status:STATUS.TRIAL,district:'東區',

  status:STATUS.QUOTE,district:'中西區',type:'餐飲',trialDays:12,lastVisitDays:4}));

/* ═══════════════════════════════════════════════════════════════════
   4. 衍生計算：金額、關注規則、彙總
   ═══════════════════════════════════════════════════════════════════ */
const trialAmt=c=>TRIAL_SET.includes(c.status)?sumFw4(c.trialItems):0;
const dealAmt =c=>c.status===STATUS.DEAL?sumFw4(c.contractedItems):0;
const lastVisit=c=>(c.visits&&c.visits.length)?c.visits[0].date:'';

/* 關注規則（severity 1=最急）。一家客戶可同時命中多條。 */
const RULES=[
  {key:'stall', sev:1,label:'試用停滯',  hint:'試用超過 30 天未推進',
   test:c=>c.status===STATUS.TRIAL&&daysSince(c.trialDate)>30,
   why:c=>'試用已 <b>'+daysSince(c.trialDate)+' 天</b>，仍停在「試用中」未報價'},
  {key:'closing',sev:2,label:'將成約逾期',hint:'停在將成約超過 14 天',
   test:c=>c.status===STATUS.CLOSING&&daysSince(lastVisit(c))>14,
   why:c=>'停在「將成約」，已 <b>'+daysSince(lastVisit(c))+' 天</b>沒有新的拜訪紀錄'},
  {key:'big',   sev:3,label:'高金額案',  hint:'試用 4W 金額 ≥ $10,000',
   test:c=>trialAmt(c)>=10000,
   why:c=>'試用 4W 金額 <b>'+money(trialAmt(c))+'</b>，成敗影響月度目標'},
  {key:'cold',  sev:4,label:'久未拜訪',  hint:'開發中客戶超過 21 天未拜訪',
   test:c=>ACTIVE_SET.includes(c.status)&&daysSince(lastVisit(c))>21,
   why:c=>'開發中但已 <b>'+daysSince(lastVisit(c))+' 天</b>沒去了'},
];
function flagsOf(c){return RULES.filter(r=>{try{return r.test(c);}catch(e){return false;}});}

/* 未定位客戶：固定約 12%（地址 geocode 失敗是主系統的日常）。
   同樣不交給機率——地圖的「另有 N 家沒有座標」必須每次都能被驗證。 */
shuffle(CLIENTS.filter(c=>c.lat!=null)).slice(0,Math.round(CLIENTS.length*0.12))
  .forEach(c=>{c.lat=null;c.lng=null;});

/* 重複建檔偵測（同業務同名） */
const DUP=new Set();
(function(){
  const m={};
  CLIENTS.forEach(c=>{const k=c.repId+'|'+c.name.trim();(m[k]=m[k]||[]).push(c.id);});
  Object.values(m).forEach(ids=>{if(ids.length>1)ids.forEach(id=>DUP.add(id));});
})();

function metrics(list){
  const m={total:list.length,active:0,trialShop:0,trialAmt:0,dealShop:0,dealAmt:0,noItem:0,conv:0};
  list.forEach(c=>{
    if(ACTIVE_SET.includes(c.status))m.active++;
    if(TRIAL_SET.includes(c.status)){m.trialShop++;m.trialAmt+=trialAmt(c);if(!c.trialItems.length)m.noItem++;}
    if(c.status===STATUS.DEAL){m.dealShop++;m.dealAmt+=dealAmt(c);}
  });
  const eng=m.trialShop+m.dealShop;
  m.conv=eng?m.dealShop/eng:0;
  return m;
}

/* 漏斗：九階段收斂成五段（長官看的是趨勢不是細節） */

  {label:'未接觸',statuses:[STATUS.UNVISITED],   color:'--text3'},

  view:'overview',            // overview | list | map

const FAIL_REP='r4';
const FAIL_MSG='回應非 JSON（請確認 Apps Script 部署權限為「任何人」且網址正確）';

function scenarioReps(){
  if(S.scenario==='empty')return [];

function pool(){
  if(S.scenario==='empty'||S.scenario==='newbie'||S.scenario==='loading')return [];
  if(S.scenario==='partial')return CLIENTS.filter(c=>c.repId!==FAIL_REP);
  return CLIENTS;
}
function repList(){
  if(S.scenario==='empty')return [];
  if(S.scenario==='newbie')return REPS.map(r=>({...r,error:null}));
  return REPS.map(r=>({...r,error:(S.scenario==='partial'&&r.id===FAIL_REP)?FAIL_MSG:null}));
}
function syncedAt(){
  if(S.scenario==='stale')return {txt:'2026-08-13 18:42',stale:true,hours:66};
  return {txt:'2026-08-16 08:05',stale:false,hours:1};
}

/* 篩選後的客戶清單（清單頁 / 地圖頁共用同一個來源） */
function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase();
  return pool().filter(c=>{
    if(f.rep&&c.repId!==f.rep)return false;
    if(f.status){
      if(f.status==='__active'){if(!ACTIVE_SET.includes(c.status))return false;}
      else if(f.status==='__trial'){if(!TRIAL_SET.includes(c.status))return false;}
      else if(c.status!==f.status)return false;
    }
    if(f.district&&c.district!==f.district)return false;
    if(f.flag&&!flagsOf(c).some(r=>r.key===f.flag))return false;
    if(q){
      const hay=(c.name+' '+c.district+' '+c.addr+' '+RMAP[c.repId].name+' '+c.type).toLowerCase();
      if(hay.indexOf(q)<0)return false;
    }
    return true;
  });
}
const hasFilter=()=>!!(S.f.rep||S.f.status||S.f.district||S.f.flag||S.f.q);
function clearFilters(){S.f={rep:'',status:'',district:'',flag:'',q:''};$('q').value='';render();}
function gotoList(patch){S.f=Object.assign({rep:'',status:'',district:'',flag:'',q:''},patch||{});S.view='list';render();window.scrollTo({top:0,behavior:'smooth'});}

/* ── ⚠ 需要關注（第一眼焦點） ───────────────────────────────── */
function attentionItems(){
  const out=[];
  pool().forEach(c=>{
    const fl=flagsOf(c);
    if(fl.length)out.push({c:c,flags:fl,sev:Math.min.apply(null,fl.map(f=>f.sev))});
  });
  out.sort((a,b)=>a.sev-b.sev||(trialAmt(b.c)-trialAmt(a.c))||(a.c.name<b.c.name?-1:1));
  return out;
}
function attentionCard(){
  const all=attentionItems();
  const counts={all:all.length};
  RULES.forEach(r=>counts[r.key]=all.filter(i=>i.flags.some(f=>f.key===r.key)).length);
  const shown=S.attKey==='all'?all:all.filter(i=>i.flags.some(f=>f.key===S.attKey));

  const chips='<div class="att-filters">'+

/* ── 全所漏斗 ─────────────────────────────────────────────── */
function funnelCard(){
  const list=pool();
  if(!list.length)return '';
  const rows=FUNNEL.map(f=>{
    const cs=list.filter(c=>f.statuses.includes(c.status));
    const amt=cs.reduce((s,c)=>s+trialAmt(c)+dealAmt(c),0);
    return {label:f.label,color:f.color,n:cs.length,amt:amt,statuses:f.statuses};
  });
  const max=Math.max.apply(null,rows.map(r=>r.n))||1;
  const lost=list.filter(c=>c.status===STATUS.REFUSE).length;
  const trans=list.filter(c=>c.status===STATUS.TRANSFER).length;
  return '<div class="card"><div class="card-h"><span class="card-t">全所漏斗</span>'+
    '<span class="card-sub">九階段收斂為五段</span></div><div class="card-b">'+
    '<div class="fn">'+rows.map(r=>
      '<div class="fn-row"><span class="fn-lab">'+esc(r.label)+'</span>'+
      '<span class="fn-track"><i class="fn-fill" style="width:'+(r.n/max*100).toFixed(1)+'%;background:var('+r.color+')"></i></span>'+
      '<span class="fn-num"><b>'+r.n+'</b> 家'+(r.amt?' · '+money(r.amt):'')+'</span></div>').join('')+
    '</div><div class="fn-foot"><span>已轉交 <b>'+trans+'</b> 家</span><span>拒絕 <b>'+lost+'</b> 家</span>'+
    '<span class="muted">此圖不含已轉交／拒絕</span></div></div></div>';
}

function mountMap(){
  if(typeof L==='undefined')return;
  const el=$('map');if(!el)return;
  _marks={};
  _map=L.map(el,{scrollWheelZoom:false}).setView([22.995,120.205],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'}).addTo(_map);
  _layer=L.layerGroup().addTo(_map);
  const geo=filtered().filter(c=>c.lat!=null);
  const cs=getComputedStyle(document.documentElement);
  geo.forEach(c=>{
    const amt=trialAmt(c)||dealAmt(c);
    const r=6+Math.min(11,Math.sqrt(amt)/16);
    const col=(cs.getPropertyValue(PIN[c.status]||'--text3')||'#888').trim();
    const m=L.circleMarker([c.lat,c.lng],{radius:r,color:col,weight:2,fillColor:col,fillOpacity:.42});
    m.bindPopup('<div class="pop-n">'+esc(c.name)+'</div>'+
      '<div class="pop-r">'+esc(c.status)+' · '+esc(RMAP[c.repId].name)+' · '+esc(c.district)+'<br>'+
      (amt?'4W 金額 '+money(amt):'尚未登記品項')+'</div>'+
      '<button class="pop-b" data-open="'+c.id+'">看客戶詳情</button>');
    m.addTo(_layer);_marks[c.id]=m;
  });
  if(geo.length)_map.fitBounds(L.latLngBounds(geo.map(c=>[c.lat,c.lng])).pad(.12));
  if(S.focusId&&_marks[S.focusId]){_map.setView(_marks[S.focusId].getLatLng(),16);_marks[S.focusId].openPopup();S.focusId=null;}
}

      '<div class="dr-sec-t">需要關注</div>'+
      fl.map(f=>'<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px">'+
        '<i class="sev-d sev-'+f.sev+'" style="margin-top:6px"></i>'+
        '<div><b style="font-size:12.5px">'+esc(f.label)+'</b>'+
        '<div style="font-size:12.5px;color:var(--text2)">'+f.why(c)+'</div></div></div>').join('')+
      '</div>':'')+
    '<div class="dr-sec"><div class="dr-money">'+
      '<div><div class="l">試用金額（4W）</div><div class="v'+(trialAmt(c)?' g':'')+'">'+
        (noItem?'<span style="font-size:13px;color:var(--amber-d)">未登記品項</span>':money(trialAmt(c)))+'</div></div>'+
      '<div><div class="l">成約金額（4W）</div><div class="v'+(dealAmt(c)?' g':'')+'">'+money(dealAmt(c))+'</div></div>'+
    '</div></div>'+
    '<div class="dr-sec"><div class="dr-sec-t">試用品項'+(c.trialDate?'（自 '+esc(c.trialDate)+'，已 '+daysSince(c.trialDate)+' 天）':'')+'</div>'+
      itemRows(c.trialItems,'試用')+'</div>'+
    (c.contractedItems.length?'<div class="dr-sec"><div class="dr-sec-t">成約品項</div>'+itemRows(c.contractedItems,'成約')+'</div>':'')+
    '<div class="dr-sec"><div class="dr-sec-t">拜訪紀錄（'+c.visits.length+'）</div>'+
      (c.visits.length?'<div class="tl">'+c.visits.map(v=>
        '<div class="tl-i"><span class="tl-d"></span><div class="tl-c">'+
        '<div class="tl-t"><span>'+esc(v.date)+'</span><span>'+esc(dLabel(v.date))+'</span>'+
        '<span class="tag">心情 '+esc(MOOD[v.mood]||'—')+'</span></div>'+
        '<div class="tl-n">'+esc(v.note)+(v.insight?'\n💡 '+esc(v.insight):'')+'</div>'+
        '</div></div>').join('')+'</div>'
        :'<div class="muted" style="font-size:12.5px">尚無拜訪紀錄</div>')+'</div>'+
    '<div class="dr-sec" style="border-bottom:0"><div class="dr-sec-t">基本資料</div>'+
      '<dl class="kv">'+
        '<dt>地址</dt><dd>'+esc(c.addr)+'</dd>'+
        '<dt>窗口</dt><dd>'+esc(c.contact)+'　'+esc(c.phone)+'</dd>'+
        '<dt>負責業務</dt><dd>'+esc(rep.name)+'（'+esc(rep.area)+'）</dd>'+
        '<dt>下次拜訪</dt><dd>'+(c.nextdate?esc(c.nextdate)+'（'+esc(dLabel(c.nextdate))+'）':'<span class="muted">未排定</span>')+'</dd>'+
        '<dt>備註</dt><dd>'+esc(c.note||'—')+'</dd>'+
      '</dl></div>'+
  '</div>'+
  '<div class="dr-f">'+
    '<button class="btn btn-primary grow" data-act="copy" data-id="'+c.id+'">複製摘要給業務</button>'+
    (c.lat!=null?'<button class="btn" data-act="locate" data-id="'+c.id+'">在地圖上顯示</button>':'')+
  '</div>';
  const d=$('drawer');
  d.innerHTML=html;d.classList.add('on');$('scrim').classList.add('on');
  d.focus();
}
function closeDrawer(){S.drawer=null;$('drawer').classList.remove('on');$('scrim').classList.remove('on');}

function summaryText(c){
  const rep=RMAP[c.repId],fl=flagsOf(c);
  const lines=[
    '【'+c.name+'】'+c.status+'（'+rep.name+'／'+c.district+'）',
    '試用 4W：'+(c.trialItems.length?money(trialAmt(c)):'未登記品項'),
    c.trialItems.length?('　'+c.trialItems.map(it=>it.product+'×'+(it.qty||1)).join('、')):'',
    c.contractedItems.length?('成約 4W：'+money(dealAmt(c))):'',
    '最後拜訪：'+(lastVisit(c)||'無')+'（'+dLabel(lastVisit(c))+'）',
    c.nextdate?('下次拜訪：'+c.nextdate):'下次拜訪：未排定',
    fl.length?('提醒：'+fl.map(f=>f.label).join('、')):'',
  ];
  return lines.filter(Boolean).join('\n');
}

/* ═══════════════════════════════════════════════════════════════════
   11. 搜尋建議
   ═══════════════════════════════════════════════════════════════════ */
function renderSugg(){
  const q=$('q').value.trim().toLowerCase(),box=$('sugg');
  if(!q){box.classList.remove('on');box.innerHTML='';return;}
  const hits=pool().filter(c=>(c.name+' '+c.district+' '+RMAP[c.repId].name+' '+c.addr).toLowerCase().indexOf(q)>=0).slice(0,8);
  box.innerHTML=hits.length
    ? hits.map(c=>'<div class="sugg-item" data-open="'+c.id+'" role="option">'+
        '<div class="trunc">'+esc(c.name)+' '+sBadge(c.status,1)+'</div>'+
        '<div class="s-sub">'+esc(RMAP[c.repId].name)+' · '+esc(c.district)+' · '+
        (trialAmt(c)?money(trialAmt(c)):'—')+'</div></div>').join('')
      +'<div class="sugg-item" data-act="searchall"><b>在客戶清單搜尋「'+esc($('q').value.trim())+'」</b></div>'
    : '<div class="sugg-empty">找不到「'+esc($('q').value.trim())+'」<br>試試店名、地區或業務姓名</div>';
  box.classList.add('on');
}

/* ═══════════════════════════════════════════════════════════════════
   12. 事件（單一委派）
   ═══════════════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-scn],[data-att],[data-go],[data-open],[data-sort],[data-f],[data-act]');
  if(!t)return;
  /* 視角切換 */
  if(t.dataset.view){S.view=t.dataset.view;S.drawer&&closeDrawer();render();return;}
  /* 原型狀態切換 */
  if(t.dataset.scn){
    S.scenario=t.dataset.scn;S.attKey='all';clearFiltersSilent();closeDrawer();
    document.querySelectorAll('.dev-b').forEach(b=>b.classList.toggle('on',b.dataset.scn===S.scenario));
    if(S.scenario==='loading'){render();setTimeout(()=>{if(S.scenario==='loading'){S.scenario='normal';
      document.querySelectorAll('.dev-b').forEach(b=>b.classList.toggle('on',b.dataset.scn==='normal'));render();
      toast('載入完成');}},2200);return;}
    render();return;
  }
  /* Attention Feed 分類 */
  if(t.dataset.att){S.attKey=t.dataset.att;render();return;}
  /* 帶篩選跳到清單 */
  if(t.dataset.go){try{gotoList(JSON.parse(t.dataset.go));}catch(err){}return;}
  /* 開客戶 Drawer */
  if(t.dataset.open){
    if(t.dataset.focus&&_map&&_marks[t.dataset.focus]){
      _map.setView(_marks[t.dataset.focus].getLatLng(),16);
      document.querySelectorAll('.mlist').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    }
    $('sugg').classList.remove('on');
    openDrawer(t.dataset.open);return;
  }
  /* 排序 */
  if(t.dataset.sort){
    const k=t.dataset.sort;
    if(S.sort.key===k)S.sort.dir*=-1;
    else S.sort={key:k,dir:(k==='name'||k==='rep'||k==='district')?1:-1};
    render();return;
  }
  /* 動作 */
  const a=t.dataset.act;
  if(a==='close'){closeDrawer();return;}
  if(a==='clear'){clearFilters();return;}
  if(a==='reload'){
    const back=S.scenario;S.scenario='loading';render();
    setTimeout(()=>{S.scenario=back==='stale'?'normal':back;
      document.querySelectorAll('.dev-b').forEach(b=>b.classList.toggle('on',b.dataset.scn===S.scenario));
      render();toast('已更新');},1400);return;
  }
  if(a==='nogeo'){toast('原型示意：正式版會跳到「未定位客戶」清單供批次修正');return;}
  if(a==='searchall'){S.f.q=$('q').value.trim();S.view='list';$('sugg').classList.remove('on');render();return;}
  if(a==='copy'){
    const c=CLIENTS.find(x=>x.id===t.dataset.id);if(!c)return;
    const txt=summaryText(c);
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(txt).then(()=>toast('摘要已複製，可直接貼到 LINE')).catch(()=>toast('複製失敗，請手動選取'));
    else toast('此瀏覽器不支援自動複製');
    return;
  }
  if(a==='locate'){
    const c=CLIENTS.find(x=>x.id===t.dataset.id);if(!c)return;
    S.focusId=c.id;S.view='map';closeDrawer();render();return;
  }
});
function clearFiltersSilent(){S.f={rep:'',status:'',district:'',flag:'',q:''};const q=$('q');if(q)q.value='';}

document.addEventListener('change',e=>{
  const f=e.target.dataset&&e.target.dataset.f;
  if(!f)return;
  S.f[f]=e.target.value;render();
});
$('scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('sugg').classList.contains('on')){$('sugg').classList.remove('on');return;}
    if(S.drawer)closeDrawer();
  }
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
});
$('q').addEventListener('input',renderSugg);
$('q').addEventListener('keydown',e=>{
  if(e.key==='Enter'){S.f.q=$('q').value.trim();S.view='list';$('sugg').classList.remove('on');render();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('sugg').classList.remove('on');});

/* 深淺色切換：自動 → 淺 → 深 */
let _theme=0;const THEMES=[['','自動'],['light','淺色'],['dark','深色']];
$('theme-btn').addEventListener('click',()=>{
  _theme=(_theme+1)%3;
  const[v,l]=THEMES[_theme];
  if(v)document.documentElement.setAttribute('data-theme',v);
  else document.documentElement.removeAttribute('data-theme');
  $('theme-lab').textContent=l;
  if(S.view==='map')render();
});

/* ═══════════════════════════════════════════════════════════════════
   13. 啟動
   ═══════════════════════════════════════════════════════════════════ */
document.querySelectorAll('.dev-b').forEach(b=>b.classList.toggle('on',b.dataset.scn===S.scenario));
render();
</script>
