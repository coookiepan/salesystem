name: 新登記商家（下載測試）

# 測試階段：只在這個分支推送或手動觸發時跑；確認抓得到之後才改成每月排程。
on:
  workflow_dispatch:
  push:
    branches: [claude/newbiz]
    paths: ['.github/workflows/newbiz.yml', 'tools/newbiz/**']

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 下載 115/06–115/10 臺南市設立登記營業項目清冊
        run: |
          mkdir -p pdf
          for ym in 11506 11507 11508 11509 11510; do
            url="https://serv.gcis.nat.gov.tw/moeadsBF/cmpy/reportAction.do?method=report&reportClass=bmsItem&subPath=${ym}&fileName=376610000Asetup${ym}.pdf"
            code=$(curl -sS -L -m 120 --retry 2 -A "Mozilla/5.0" -o "pdf/item${ym}.pdf" -w "%{http_code}" "$url" || echo ERR)
            echo "${ym} http=${code} bytes=$(stat -c %s pdf/item${ym}.pdf 2>/dev/null) type=$(file -b pdf/item${ym}.pdf 2>/dev/null | cut -c1-40)"
          done
      - name: 傳回檔案（測試用，跑完即刪除這次執行紀錄）
        run: |
          for f in pdf/*.pdf; do echo "@@BEGIN $f"; base64 -w 3000 "$f"; echo "@@END $f"; done
