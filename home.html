<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06332B">
<title>首頁｜DUSKIN 銷售系統</title>
<link rel="icon" href="logo-mark.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
<link rel="stylesheet" href="tokens.css">
<script src="nav.js" data-page="home" defer></script>
<style>
/* 色彩／圓角／字體家族一律在 tokens.css（唯一來源）；這裡只放首頁專屬 */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{font-family:var(--font-sans);background:var(--bg2);color:var(--text);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
.phone{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.hd{padding:20px 20px 14px;display:flex;align-items:flex-start;gap:12px}
.hd .hi{flex:1;min-width:0}
.hd .date{font-family:var(--font-num);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text3)}
.hd h1{font-size:28px;font-weight:800;letter-spacing:-.032em;line-height:1.15;margin-top:7px}
.syncs{display:flex;flex-direction:column;gap:5px;padding-top:4px}
.sync{display:flex;align-items:center;gap:5px;font-family:var(--font-num);font-size:12.5px;font-weight:500;color:var(--text2);justify-content:flex-end}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.dot.warn{background:var(--amber)}.dot.off{background:var(--text3)}

.wrap{padding:0 20px;display:flex;flex-direction:column;gap:12px}

/* ═══ 主角區塊 — 每頁只有一個，放今天唯一重要的那個數字 ═══ */
.slab{position:relative;background:var(--theme);color:var(--on-theme);border-radius:var(--r-lg);padding:18px 20px 0;overflow:hidden}
.slab::before{content:'';position:absolute;left:0;right:0;top:0;height:7px;background-image:repeating-linear-gradient(to right,rgba(159,189,177,.55) 0 1px,transparent 1px 14px)}
.eyebrow{font-family:var(--font-num);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--on-theme-2)}
.slab-row{display:flex;align-items:flex-start;gap:12px;margin-top:12px}
.slab-row .big{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px}
.disp{font-family:var(--font-num);font-size:52px;font-weight:600;line-height:.9;letter-spacing:-.045em}
.slab-row .u{font-size:15px;font-weight:700}
.slab-side{text-align:right;font-family:var(--font-num);font-size:12px;color:var(--on-theme-2);line-height:1.7;white-space:nowrap}
.slab-route{font-family:var(--font-num);font-size:12.5px;color:var(--on-theme-2);margin-top:10px}
.slab-gauge{margin:16px -20px 0}
/* 量尺（與主系統同一支）：刻度＝今天幾家、填滿＝跑完的、游標＝現在在哪 */
.gauge{position:relative;height:5px;background:rgba(159,189,177,.26);overflow:hidden}
.gauge>.f{position:absolute;left:0;top:0;bottom:0;background:var(--green-lit);transform-origin:left center;animation:gaugeDraw .44s var(--ease) both}
.gauge>.k{position:absolute;top:0;bottom:0;width:2px;background:var(--on-theme)}
.gauge.tk::after{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(to right,var(--theme) 0 1px,transparent 1px var(--tick,10%))}
@keyframes gaugeDraw{from{transform:scaleX(0)}to{transform:scaleX(1)}}

.stops{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.stop{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border)}
.stop:last-child{border-bottom:none}
.stop .seq{width:26px;height:26px;border-radius:50%;border:1px solid var(--tone,var(--text3));color:var(--tone,var(--text3));font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop .seq.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.stop .nm{font-size:15.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.014em}
.stop .nm small{display:block;font-size:12.5px;color:var(--text2);font-weight:400;letter-spacing:0}
/* 狀態＝一個點＋粗字（顏色只說急迫度，字說階段） */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--tone);white-space:nowrap;letter-spacing:.02em}
.chip::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.c-amber{--tone:var(--amber)}.c-blue{--tone:var(--blue)}.c-gray{--tone:var(--text2)}
.c-green{--tone:var(--green-d)}.c-red{--tone:var(--red)}
.trip-empty{padding:16px;font-size:14px;color:var(--text2);text-align:center;line-height:1.7}

.overdue{padding:11px 14px;border-radius:var(--r-sm);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;background:var(--red-l);color:var(--red)}
.overdue a{margin-left:auto;font-size:13px;font-weight:700;text-decoration:underline;color:inherit}
.trip-act{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 18px;font-size:15px;font-weight:700;border-radius:var(--r-sm);border:1px solid transparent;line-height:1.2;letter-spacing:.01em;transition:background .14s var(--ease),border-color .14s var(--ease)}
.btn-primary{background:var(--green);color:var(--on-green);flex:1}
.btn-outline{background:var(--bg);color:var(--text);border-color:var(--border2)}
.btn-outline:active{background:var(--surface-hover)}

/* ═══ 排印式統計列：細線分隔，不做四個白盒子 ═══ */
.stats{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.stats>.stat{flex:1;padding:12px 10px 11px;border-left:1px solid var(--border);display:block;min-width:0}
.stats>.stat:first-child{border-left:0;padding-left:0}
.stat .v{font-family:var(--font-num);font-size:25px;font-weight:600;line-height:1;letter-spacing:-.035em;display:block}
.stat .k{font-size:12.5px;color:var(--text2);margin-top:6px;display:block;font-weight:500}
.stat.warn .v{color:var(--amber)}
.stat.bad .v{color:var(--red)}

/* ═══ 區段標題：標籤＋往右延伸的細線 ═══ */
.sec-t{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text2);margin:14px 0 -2px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--border)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.qa{background:var(--bg);padding:14px;display:flex;align-items:center;gap:11px;min-height:70px}
.qa:active{background:var(--surface-hover)}
.qa .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green-d)}
.qa .tx{min-width:0}
.qa .tx b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.qa .tx small{font-size:12px;color:var(--text2)}

.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.rp-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.rp-head b{font-size:16px;font-weight:700;letter-spacing:-.014em}
.rp-head span{font-family:var(--font-num);font-size:12.5px;color:var(--text2)}
.week{display:flex;gap:22px;margin-bottom:14px;flex-wrap:wrap}
.week div{font-size:12.5px;color:var(--text2);font-weight:500}
.week b{display:block;font-family:var(--font-num);font-size:26px;font-weight:600;color:var(--text);letter-spacing:-.035em;line-height:1}
.rp-act{display:flex;gap:8px}
.rp-act .btn{flex:1;min-height:44px;padding:0 10px;font-size:13.5px}

.apps{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.app{background:var(--bg);padding:13px 16px;display:flex;align-items:center;gap:12px;min-height:62px}
.app:active{background:var(--surface-hover)}
.app .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green-d)}
.app .tx{flex:1;min-width:0}
.app .tx b{display:block;font-size:15px;font-weight:700;letter-spacing:-.012em}
.app .tx small{font-size:12.5px;color:var(--text2)}
.app .arrow{color:var(--text3);font-size:18px}

.foot{text-align:center;font-family:var(--font-num);font-size:12.5px;color:var(--text2);padding:14px 0 4px}
</style>
</head>
<body>
<div class="phone">

  <header class="hd">
    <div class="hi">
      <div class="date num" id="h-date"></div>
      <h1 id="h-greet">你好</h1>
    </div>
    <div class="syncs" id="h-syncs" title="三個系統的雲端同步狀態"></div>
  </header>

  <main class="wrap">

    <section class="slab" aria-label="今日行程">
      <p class="eyebrow">今日行程</p>
      <div class="slab-row">
        <p class="big"><span class="disp num" id="t-count">0</span><span class="u" id="t-unit">家待跑</span></p>
        <p class="slab-side" id="t-side"></p>
      </div>
      <p class="slab-route" id="t-route"></p>
      <div class="slab-gauge" id="t-gauge"></div>
    </section>

    <div class="stops" id="t-stops"></div>
    <div class="overdue" id="t-overdue" style="display:none">逾期 <b class="num" id="t-od">0</b> 家未處理<a href="index.html#trip">處理</a></div>
    <div class="overdue" id="t-fusion" style="display:none;background:var(--amber-l);color:var(--amber)"><span id="t-fusion-txt"></span><a href="index.html#trip">看行程</a></div>
    <div class="trip-act">
      <a class="btn btn-primary" href="index.html#trip">開始跑 →</a>
      <a class="btn btn-outline" href="index.html#trip">＋順路</a>
    </div>

    <section class="stats" aria-label="今日概況">
      <a class="stat" href="index.html#trip"><span class="v" id="s-trip">0</span><span class="k">今日行程</span></a>
      <a class="stat bad" href="index.html#trip"><span class="v" id="s-od">0</span><span class="k">逾期</span></a>
      <a class="stat warn" href="index.html#clients"><span class="v" id="s-trial">0</span><span class="k">試用該收</span></a>
      <a class="stat" href="index.html#todos"><span class="v" id="s-todo">0</span><span class="k">今日待辦</span></a>
    </section>

    <div class="sec-t">快速動作</div>
    <section class="quick">
      <a class="qa" href="sitemap.html#place"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M2 20h20"/><path d="M4 20V9l6-4v15"/><path d="M10 9h6l4 4v7"/></svg></span><span class="tx"><b>登記工地</b><small>GPS 一鍵，3 秒完成</small></span></a>
      <a class="qa" href="index.html#new"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span class="tx"><b>新客戶</b><small>建檔到主系統</small></span></a>
      <a class="qa" href="index.html#shops"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span><span class="tx"><b>找客戶</b><small>查詢公司既有客戶</small></span></a>
      <a class="qa" href="index.html#daily"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span><span class="tx"><b>寫日報</b><small>今天的拜訪紀錄</small></span></a>
    </section>

    <div class="sec-t">報告</div>
    <section class="card" aria-label="報告">
      <div class="rp-head"><b>本週成果</b><span class="num" id="w-range"></span></div>
      <div class="week">
        <div><b class="num" id="w-visits">0</b>拜訪</div>
        <div><b class="num" id="w-deals">0</b>成約</div>
        <div><b class="num" id="w-trials">0</b>新試用</div>
      </div>
      <div class="rp-act">
        <a class="btn btn-outline" href="index.html#daily">日報表</a>
        <a class="btn btn-outline" href="index.html#daily">4W 推進表</a>
      </div>
    </section>

    <div class="sec-t">系統</div>
    <section class="apps">
      <a class="app" href="index.html">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="tx"><b>客戶管理</b><small id="a-main">主系統</small></span>
        <span class="arrow">›</span>
      </a>
      <a class="app" href="sitemap.html">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M2 20h20"/><path d="M4 20V9l6-4v15"/><path d="M10 9h6l4 4v7"/></svg></span>
        <span class="tx"><b>工地地圖</b><small id="a-site">施工店面共享登記</small></span>
        <span class="arrow">›</span>
      </a>
      <a class="app" href="izcrm.html">
        <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M2 20h20"/><path d="M4 20V8l5 3V8l5 3V8l5 3v9"/></svg></span>
        <span class="tx"><b>工業區CRM</b><small id="a-iz">工廠陌生開發</small></span>
        <span class="arrow">›</span>
      </a>
    </section>

    <div class="foot">DUSKIN 銷售系統 首頁 <span id="h-ver"></span></div>
  </main>

</div>

<script>
/* ══════════════════════════════════════════════════════════
   DUSKIN 首頁（樞紐）— 唯讀鏡射三個系統的 localStorage，零後端。
   duskin_v2（主系統）/ sitemap_v1（工地地圖）/ izcrm_v1（工業區CRM）
   只讀不寫；資料不存在時顯示空狀態，永不擋住導航。
   ══════════════════════════════════════════════════════════ */
const HOME_VERSION='v2026.10.01-h2';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function readJSON(key,fallback){
  try{const r=localStorage.getItem(key);return r?JSON.parse(r):fallback;}catch(e){return fallback;}
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseRegion(addr){
  const m=String(addr||'').replace(/^臺南市|^台南市/,'').match(/^.{0,6}?([^\s,，]{1,3}區)/);
  return m?m[1]:'';
}

const now=new Date();
const TODAY=ymd(now);
// 本週（一～日）
const wd=(now.getDay()+6)%7;
const monday=new Date(now);monday.setDate(now.getDate()-wd);
const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
const W0=ymd(monday),W1=ymd(sunday);

/* ── 讀三個系統 ── */
const main=readJSON('duskin_v2',null);
const clients=(main&&Array.isArray(main.clients))?main.clients.filter(Boolean):[];
const gtodos=(main&&Array.isArray(main.gtodos))?main.gtodos:[];
const outbox=readJSON('duskin_outbox',[]);
const sm=readJSON('sitemap_v1',null);
const sites=(sm&&Array.isArray(sm.sites))?sm.sites.filter(s=>s&&!s.deleted):[];
const iz=readJSON('izcrm_v1',null);

/* ── 頂欄 ── */
const WEEK=['日','一','二','三','四','五','六'];
document.getElementById('h-date').textContent=(now.getMonth()+1)+' 月 '+now.getDate()+' 日（'+WEEK[now.getDay()]+'）';
const hour=now.getHours();
const greet=hour<11?'早安':hour<18?'午安':'晚安';
const who=(main&&main.profile&&main.profile.contact)?main.profile.contact:'';
document.getElementById('h-greet').textContent=greet+(who?'，'+who:''); // textContent 安全，不需轉義

function syncRow(name,ok,pendingN){
  const cls=ok===null?'off':(pendingN>0?'warn':'');
  const txt=ok===null?'未設定':(pendingN>0?pendingN+' 筆待推':'已同步');
  return '<div class="sync"><span class="dot '+cls+'"></span>'+name+' '+txt+'</div>';
}
document.getElementById('h-syncs').innerHTML=
  syncRow('主系統', main&&main.sheetUrl?true:null, Array.isArray(outbox)?outbox.length:0)+
  syncRow('工地', sm&&sm.cfg&&sm.cfg.url?true:null, sm&&Array.isArray(sm.queue)?sm.queue.length:0)+
  syncRow('工業區', iz&&iz.gasUrl?true:null, iz&&iz.dirty?Object.keys(iz.dirty).length:0);

/* ── 今日行程 ── */
// 狀態色＝急迫度（與主系統 tokens.css 同一套語彙）：進行中藍、該你動作橙、成約綠、拒絕紅、未開始無彩度
const stChip=s=>{
  if(s==='初訪'||s==='複訪'||s==='試用中')return [s,'c-blue'];
  if(s==='報價'||s==='將成約')return [s,'c-amber'];
  if(s==='已成約'||s==='已轉交')return [s,'c-green'];
  if(s==='拒絕')return [s,'c-red'];
  return [s||'未拜訪','c-gray'];
};
const trips=clients.filter(c=>c.nextdate===TODAY);
const overdue=clients.filter(c=>c.nextdate&&c.nextdate<TODAY);
// 「跑完了」＝今天有拜訪紀錄（真資料，不推估）
const isDone=c=>(c.visits||[]).some(v=>v&&v.date===TODAY);
const doneN=trips.filter(isDone).length;
document.getElementById('t-count').textContent=trips.length?trips.length-doneN:0;
document.getElementById('t-unit').textContent=trips.length?'家待跑':'家排程';
document.getElementById('s-trip').textContent=trips.length;
document.getElementById('t-side').innerHTML=trips.length?('已跑<br><b style="font-size:19px;font-weight:600;color:var(--on-theme)">'+doneN+'</b> / '+trips.length+' 家'):'';
const regions=[...new Set(trips.map(c=>parseRegion(c.addr)).filter(Boolean))];
document.getElementById('t-route').textContent=trips.length?(regions.length?regions.slice(0,3).join(' → '):'未填地址區'):'今天還沒排行程';
// 量尺：刻度＝今天幾家、填滿＝跑完的、游標＝現在在哪
(function(){
  const g=document.getElementById('t-gauge');if(!g)return;
  if(!trips.length){g.innerHTML='<div class="gauge"></div>';return;}
  const p=Math.round(doneN/trips.length*1000)/10;
  g.innerHTML='<div class="gauge tk" style="--tick:'+(100/trips.length).toFixed(4)+'%" aria-hidden="true">'
    +(p>0?'<div class="f" style="width:'+p+'%"></div>':'')
    +(p>0&&p<100?'<div class="k" style="left:'+p+'%"></div>':'')+'</div>';
})();
const stopsEl=document.getElementById('t-stops');
if(!clients.length){
  stopsEl.innerHTML='<div class="trip-empty">還沒有客戶資料——先開「客戶管理」完成設定，之後這裡會自動顯示每天的行程。</div>';
}else if(!trips.length){
  stopsEl.innerHTML='<div class="trip-empty">今天還沒排行程。按「開始跑 →」從逾期與順路建議把今天排起來。</div>';
}else{
  stopsEl.innerHTML=trips.slice(0,3).map((c,i)=>{
    const done=isDone(c);
    const [label,cls]=done?['已拜訪','c-green']:stChip(c.status);
    const region=parseRegion(c.addr);
    return '<div class="stop"><span class="seq num '+(done?'on':'')+'" style="--tone:var(--text3)">'+(done?'✓':(i+1))+'</span>'+
      '<span class="nm">'+esc(c.name||'-')+'<small>'+esc(region||c.addr||'')+'</small></span>'+
      '<span class="chip '+cls+'">'+esc(label)+'</span></div>';
  }).join('')+(trips.length>3?'<div class="trip-empty" style="padding:6px 0 10px">…還有 '+(trips.length-3)+' 家，進行程規劃看全部</div>':'');
}
if(overdue.length){
  document.getElementById('t-overdue').style.display='flex';
  document.getElementById('t-od').textContent=overdue.length;
}
document.getElementById('s-od').textContent=overdue.length;

/* ── 融合：工地可拜訪＋工業區待訪（唯讀鏡射，數字掛在行程卡上）── */
(function(){
  let dueSites=0,izDue=0;
  const clientSiteIds=new Set(clients.map(c=>c&&c.srcSiteId).filter(Boolean));
  sites.forEach(s=>{
    if(typeof s.lat==='number'&&typeof s.lng==='number'
       &&s.openDate&&s.openDate<=TODAY&&['已拜訪','不適合'].indexOf(s.stage)<0
       &&!(s.main&&s.main.clientId)&&!clientSiteIds.has(s.id))dueSites++;
  });
  if(iz&&iz.records)Object.values(iz.records).forEach(r=>{
    if(r&&r.visitPlan&&r.visitPlan.date&&r.visitPlan.date<=TODAY)izDue++;
  });
  if(dueSites||izDue){
    const parts=[];
    if(dueSites)parts.push(dueSites+' 個工地可拜訪');
    if(izDue)parts.push(izDue+' 家工廠待訪');
    document.getElementById('t-fusion-txt').textContent=parts.join('　');
    document.getElementById('t-fusion').style.display='flex';
  }
})();

/* ── 試用該收 / 今日待辦 ── */
// 試用該收：進行中的試用到了回收日（主系統還沒開過新版時舊格式只有 trialDate，視為開始＋14 天）
function openTrialsOf(c){
  if(Array.isArray(c.trials))return c.trials.filter(t=>t&&t.open);
  if(c.status==='試用中'&&c.trialDate){const d=new Date(c.trialDate);d.setDate(d.getDate()+14);return [{start:c.trialDate,due:ymd(d),open:true}];}
  return [];
}
const trialDue=clients.filter(c=>c.status==='試用中'&&openTrialsOf(c).some(t=>t.due&&t.due<=TODAY));
document.getElementById('s-trial').textContent=trialDue.length;
let todoN=0;
clients.forEach(c=>(c.todos||[]).forEach(t=>{if(t&&!t.done&&t.dueDate&&t.dueDate<=TODAY)todoN++;}));
gtodos.forEach(t=>{if(t&&!t.done&&t.dueDate&&t.dueDate<=TODAY)todoN++;});
document.getElementById('s-todo').textContent=todoN;

/* ── 本週成果 ── */
document.getElementById('w-range').textContent=W0.slice(5).replace('-','/')+' – '+W1.slice(5).replace('-','/');
let wVisits=0,wDeals=0,wTrials=0;
clients.forEach(c=>{
  (c.visits||[]).forEach(v=>{if(v&&v.date&&v.date>=W0&&v.date<=W1)wVisits++;});
  if((c.contractedItems||[]).some(it=>it&&it.contractDate&&it.contractDate>=W0&&it.contractDate<=W1))wDeals++;
  const starts=Array.isArray(c.trials)?c.trials.filter(Boolean).map(t=>t.start):(c.trialDate?[c.trialDate]:[]);
  if(starts.some(d=>d&&d>=W0&&d<=W1))wTrials++;
});
document.getElementById('w-visits').textContent=wVisits;
document.getElementById('w-deals').textContent=wDeals;
document.getElementById('w-trials').textContent=wTrials;

/* ── 系統卡活資訊 ── */
if(clients.length){
  const trial=clients.filter(c=>c.status==='試用中').length;
  const closing=clients.filter(c=>c.status==='將成約').length;
  document.getElementById('a-main').textContent=clients.length+' 位客戶 · 試用中 '+trial+(closing?' · 將成約 '+closing:'');
}
if(sites.length){
  const openSoon=sites.filter(s=>['施工中','裝潢收尾','完工待開幕'].indexOf(s.stage)>=0).length;
  const in7=ymd(new Date(now.getTime()+7*864e5));
  const visitable=sites.filter(s=>s.openDate&&s.openDate>=TODAY&&s.openDate<=in7&&['已拜訪','不適合'].indexOf(s.stage)<0).length;
  const drafts=sites.filter(s=>s.draft).length;
  document.getElementById('a-site').textContent='待開幕 '+openSoon+(visitable?' · 本週可拜訪 '+visitable:'')+(drafts?' · 快拍待補 '+drafts:'');
}else if(sm){
  document.getElementById('a-site').textContent='還沒有登記的工地';
}
if(iz&&iz.records&&Object.keys(iz.records).length){
  const recs=Object.values(iz.records);
  const plans=recs.filter(r=>r&&r.visitPlan).length;
  document.getElementById('a-iz').textContent='有紀錄 '+recs.length+' 家'+(plans?' · 待訪 '+plans:'');
}

document.getElementById('h-ver').textContent=HOME_VERSION;
</script>
</body>
</html>
