<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg2);color:var(--text);padding:26px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:20px}
  .row{display:flex;gap:22px}
  .item{text-align:center}
  .box{width:96px;height:64px;background:var(--bg);border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:12px;font-weight:600;margin-top:12px}
  .hx{font-size:10.5px;color:var(--text3)}
</style></head>
<body>
  <div class="ttl">Elevation · minimal, overlays only — resting cards have none</div>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:none"></div><div class="nm">rest</div><div class="hx">border only</div></div>
    <div class="item"><div class="box" style="box-shadow:0 1px 3px rgba(20,20,15,.05)"></div><div class="nm">--shadow</div><div class="hx">1px 3px /.05</div></div>
    <div class="item"><div class="box" style="box-shadow:0 4px 14px rgba(20,20,15,.07)"></div><div class="nm">--shadow-md</div><div class="hx">popover</div></div>
    <div class="item"><div class="box" style="box-shadow:0 12px 32px rgba(20,20,15,.14)"></div><div class="nm">--shadow-lg</div><div class="hx">modal</div></div>
  </div>
</body></html>
