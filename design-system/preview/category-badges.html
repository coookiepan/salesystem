<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:4px;font-size:12.5px;font-weight:600;line-height:1.7}
  .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
  .grp{display:flex;align-items:center;gap:7px}
  .cap{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}
</style></head>
<body>
  <div class="ttl">Product categories · distinct hues + solid map pins</div>
  <div class="wrap">
    <div class="grp"><span class="badge" style="background:#FAEEDA;color:#633806">拖把</span><span class="dot" style="background:#B5701A"></span></div>
    <div class="grp"><span class="badge" style="background:#E6F1FB;color:#0C447C">地墊</span><span class="dot" style="background:#0C447C"></span></div>
    <div class="grp"><span class="badge" style="background:#E1F5EE;color:#085041">芳香</span><span class="dot" style="background:#085041"></span></div>
  </div>
  <div class="cap">拖把 mops (amber) · 地墊 floor mats (blue) · 芳香 fragrance (green) — warm / cool / brand, kept far apart in hue. 2W / 4W rental cycles.</div>
</body></html>
