<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:24px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;font-size:13.5px;font-weight:500;border-radius:6px;cursor:pointer;border:1px solid transparent;font-family:inherit}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn-primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn-outline{background:var(--bg);color:var(--text);border-color:var(--border2)}
  .btn-danger{background:var(--red-l);color:var(--red);border-color:color-mix(in srgb,var(--red) 28%,var(--border))}
  .btn-sm{padding:6px 12px;font-size:13px}
  .btn-xs{padding:4px 10px;font-size:12px}
  .btn-xs svg{width:13px;height:13px}
  .cap{font-size:11px;color:var(--text3);margin-top:4px}
</style></head>
<body>
  <div class="ttl">Buttons · flat, 6px radius, line icons that inherit colour</div>
  <div class="row">
    <button class="btn btn-primary"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新增客戶</button>
    <button class="btn btn-outline">編輯</button>
    <button class="btn btn-danger">刪除</button>
  </div>
  <div class="row">
    <button class="btn btn-primary btn-sm"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>報價／合約</button>
    <button class="btn btn-outline btn-sm"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>快速報價</button>
    <button class="btn btn-outline btn-xs"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>重新載入</button>
  </div>
  <div class="cap">primary → darker green on hover · outline → surface-hover · danger → fills red on hover</div>
</body></html>
