<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border);overflow:hidden}
  .chip{height:54px}
  .lbl{padding:7px 9px;font-size:10.5px;line-height:1.5}
  .nm{font-weight:600}
  .hx{color:var(--text3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="ttl">Neutrals · warm, slightly green-shifted greys</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="lbl"><div class="nm">--bg</div><div class="hx">#ffffff</div></div></div>
    <div class="sw"><div class="chip" style="background:#F8F8F5"></div><div class="lbl"><div class="nm">--bg2</div><div class="hx">#F8F8F5</div></div></div>
    <div class="sw"><div class="chip" style="background:#EFEEE9"></div><div class="lbl"><div class="nm">--bg3</div><div class="hx">#EFEEE9</div></div></div>
    <div class="sw"><div class="chip" style="background:#E8E7E0"></div><div class="lbl"><div class="nm">--border</div><div class="hx">#E8E7E0</div></div></div>
    <div class="sw"><div class="chip" style="background:#56564F"></div><div class="lbl"><div class="nm">--text2</div><div class="hx">#56564F</div></div></div>
    <div class="sw"><div class="chip" style="background:#14140F"></div><div class="lbl"><div class="nm">--text</div><div class="hx">#14140F</div></div></div>
  </div>
</body></html>
