<!-- @dsCard group="Type" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:24px;-webkit-font-smoothing:antialiased}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:16px}
  .row{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
  .spec{color:var(--text3);font-size:11px;font-variant-numeric:tabular-nums;width:120px;flex-shrink:0}
  .page-title{font-size:20px;font-weight:600;letter-spacing:-.012em}
  .modal-title{font-size:16px;font-weight:600;letter-spacing:-.008em}
  .card-name{font-size:15.5px;font-weight:600;letter-spacing:-.008em}
  .stat{font-size:22px;font-weight:600;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="ttl">Display & titles · weight-led but easy — 600, never 700</div>
  <div class="row"><span class="spec">20 / 600</span><span class="page-title">客戶管理 Page title</span></div>
  <div class="row"><span class="spec">22 / 600 / nums</span><span class="stat">128,400</span></div>
  <div class="row"><span class="spec">16 / 600</span><span class="modal-title">新增客戶 Modal title</span></div>
  <div class="row"><span class="spec">15.5 / 600</span><span class="card-name">範例-陽光餐廳 Card name</span></div>
</body></html>
