<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg2);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .cc{background:var(--bg);border-radius:10px;border:1px solid var(--border);padding:14px 16px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .cc-name{font-size:15.5px;font-weight:600;letter-spacing:-.008em;margin-bottom:2px}
  .cc-sub{font-size:12.5px;color:var(--text2)}
  /* STATUS — a coloured state pill with a leading dot */
  .status{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#E6F1FB;color:#0C447C}
  .status .sdot{width:7px;height:7px;border-radius:50%;background:#2A6BB0}
  /* CATEGORY — unified neutral tags with a small square swatch */
  .cats{display:flex;gap:6px;margin-top:11px}
  .cat{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);font-size:11.5px;font-weight:500;color:var(--text2)}
  .cat .csq{width:8px;height:8px;border-radius:2px}
  .cc-meta{font-size:11.5px;color:var(--text3);display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:11px}
  .cap{font-size:11px;color:var(--text3);margin-top:14px;line-height:1.55}
</style></head>
<body>
  <div class="ttl">Client card · state pill vs. category tags</div>
  <div class="cc">
    <div class="top">
      <div>
        <div class="cc-name">範例-陽光餐廳</div>
        <div class="cc-sub">中正區忠孝東路100號 · 王老闆</div>
      </div>
      <span class="status"><span class="sdot"></span>試用中</span>
    </div>
    <div class="cats">
      <span class="cat"><span class="csq" style="background:#B5701A"></span>拖把</span>
      <span class="cat"><span class="csq" style="background:#085041"></span>芳香</span>
    </div>
    <div class="cc-meta"><span>下次拜訪 2026-05-01</span><span>試用 $1,620</span><span>拜訪 3 次</span></div>
  </div>
  <div class="cap">Status = a single coloured pill (a live state) up by the name. Categories = uniform hairline tags with a colour swatch — clearly a different kind of label.</div>
</body></html>
