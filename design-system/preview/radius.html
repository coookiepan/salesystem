<!-- @dsCard group="Spacing" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:24px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:18px}
  .row{display:flex;gap:22px;align-items:flex-end}
  .item{text-align:center}
  .box{background:var(--bg2);border:1px solid var(--border2)}
  .nm{font-size:12px;font-weight:600;margin-top:10px}
  .hx{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="ttl">Radius scale</div>
  <div class="row">
    <div class="item"><div class="box" style="width:84px;height:60px;border-radius:6px"></div><div class="nm">--r-sm</div><div class="hx">6px · controls</div></div>
    <div class="item"><div class="box" style="width:84px;height:60px;border-radius:10px"></div><div class="nm">--r</div><div class="hx">10px · cards</div></div>
    <div class="item"><div class="box" style="width:84px;height:60px;border-radius:14px"></div><div class="nm">--r-lg</div><div class="hx">14px · modals</div></div>
    <div class="item"><div class="box" style="width:84px;height:34px;border-radius:999px"></div><div class="nm">full</div><div class="hx">999px · pills/dots</div></div>
    <div class="item"><div class="box" style="width:54px;height:34px;border-radius:4px"></div><div class="nm">badge</div><div class="hx">4px · tags</div></div>
  </div>
</body></html>
