<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg2);color:var(--text);padding:24px;display:flex;align-items:center;gap:28px}
  .plate{width:88px;height:88px;border-radius:20px;background:var(--theme);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .plate svg{width:62px;height:62px;display:block}
  .lock{display:flex;flex-direction:column;gap:6px}
  .word{font-size:26px;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:14px;color:var(--text2)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text3);margin-top:6px}
  .sw{width:13px;height:13px;border-radius:3px;background:var(--theme);border:1px solid rgba(0,0,0,.08)}
</style></head>
<body>
  <div class="plate">
    <svg viewBox="0 0 512 512" aria-label="DUSKIN P-duck monogram">
      <path fill-rule="evenodd" fill="#ffffff" d="M150 122 L300 122 C356 122 394 154 394 192 C394 230 356 262 300 262 L210 262 L210 392 L150 392 Z M308 154 a34 34 0 1 0 0.1 0 Z"/>
      <path fill="#EF9F27" d="M390 170 L460 164 Q474 190 460 214 L390 212 Z"/>
    </svg>
  </div>
  <div class="lock">
    <div class="word">DUSKIN 銷售系統</div>
    <div class="sub">“D” turned to a P-duck · counter = eye</div>
    <div class="chip"><span class="sw"></span> #085041 plate · bowl = head · amber bill right</div>
  </div>
</body></html>
