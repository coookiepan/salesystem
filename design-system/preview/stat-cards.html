<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg2);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .scard{background:var(--bg);border-radius:10px;padding:14px 12px;text-align:center;border:1px solid var(--border)}
  .snum{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
  .slbl{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500}
  .prog{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:10px}
  .prog-f{height:100%;background:var(--green);border-radius:2px}
</style></head>
<body>
  <div class="ttl">Stat cards · daily report roll-up</div>
  <div class="stat-grid">
    <div class="scard"><div class="snum">12</div><div class="slbl">今日拜訪</div></div>
    <div class="scard"><div class="snum">3</div><div class="slbl">新客戶</div></div>
    <div class="scard"><div class="snum" style="color:var(--green)">$8,400</div><div class="slbl">成約金額</div></div>
  </div>
  <div class="scard" style="margin-top:8px;text-align:left">
    <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>成約轉換率</span><span class="snum" style="font-size:14px">38%</span></div>
    <div class="prog"><div class="prog-f" style="width:38%"></div></div>
  </div>
</body></html>
