<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .alert{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border-radius:6px;font-size:13px;margin-bottom:8px;border:1px solid transparent;line-height:1.5}
  .alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ok{background:var(--green-l);color:var(--green-d);border-color:var(--green-b)}
  .warn{background:var(--amber-l);color:var(--amber-d);border-color:#FAC775}
  .err{background:var(--red-l);color:var(--red);border-color:#F7C1C1}
  .info{background:var(--blue-l);color:var(--blue-d);border-color:#B5D4F4}
</style></head>
<body>
  <div class="ttl">Alerts · unified line icons, semantic tint backgrounds</div>
  <div class="alert ok"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg><span>連線成功，已與 Google Sheets 同步</span></div>
  <div class="alert warn"><svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg><span>今天還沒從雲端拉最新資料，可能不是最新版本</span></div>
  <div class="alert err"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span>本機儲存空間已滿，請先推送到雲端備份</span></div>
  <div class="alert info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span>公司現有客戶名單（從雲端載入）</span></div>
</body></html>
