<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border);overflow:hidden}
  .chip{height:62px}
  .lbl{padding:8px 10px;font-size:11px;line-height:1.5}
  .nm{font-weight:600;color:var(--text)}
  .hx{color:var(--text3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="ttl">Brand · single green accent</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#12A673"></div><div class="lbl"><div class="nm">--green</div><div class="hx">#12A673</div></div></div>
    <div class="sw"><div class="chip" style="background:#0A6849"></div><div class="lbl"><div class="nm">--green-d</div><div class="hx">#0A6849</div></div></div>
    <div class="sw"><div class="chip" style="background:#085041"></div><div class="lbl"><div class="nm">--theme</div><div class="hx">#085041</div></div></div>
    <div class="sw"><div class="chip" style="background:#A1DFC7"></div><div class="lbl"><div class="nm">--green-b</div><div class="hx">#A1DFC7</div></div></div>
    <div class="sw"><div class="chip" style="background:#E3F4ED"></div><div class="lbl"><div class="nm">--green-l</div><div class="hx">#E3F4ED</div></div></div>
  </div>
</body></html>
