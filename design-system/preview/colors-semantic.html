<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--bg);color:var(--text);padding:22px}
  .ttl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border);overflow:hidden}
  .chip{height:54px}
  .lbl{padding:7px 9px;font-size:10.5px;line-height:1.5}
  .nm{font-weight:600}
  .hx{color:var(--text3);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="ttl">Semantic · muted, used only for status & alerts</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#B73838"></div><div class="lbl"><div class="nm">red</div><div class="hx">#B73838</div></div></div>
    <div class="sw"><div class="chip" style="background:#B5701A"></div><div class="lbl"><div class="nm">amber</div><div class="hx">#B5701A</div></div></div>
    <div class="sw"><div class="chip" style="background:#2A6BB0"></div><div class="lbl"><div class="nm">blue</div><div class="hx">#2A6BB0</div></div></div>
    <div class="sw"><div class="chip" style="background:#3C3489"></div><div class="lbl"><div class="nm">purple-d</div><div class="hx">#3C3489</div></div></div>
    <div class="sw"><div class="chip" style="background:#BA7517"></div><div class="lbl"><div class="nm">yellow</div><div class="hx">#BA7517</div></div></div>
  </div>
</body></html>
